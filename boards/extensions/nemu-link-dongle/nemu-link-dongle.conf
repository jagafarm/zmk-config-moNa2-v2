CONFIG_USB_DEVICE_PRODUCT="nemu-link Dongle"

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# BLE central (右手) と dongle でキーマップを共有し、
# ドングル経由で Studio UI を使えるようにする
CONFIG_ZMK_NEMU_LINK_MODE_CONTROL=y
CONFIG_ZMK_NEMU_LINK_STUDIO_ENDPOINT=y

# ESB 時は peripheral 側の input processor がバイパスされるため、
# dongle 側 listener で runtime processor (temp-layer / scroll 変換) を動かす。
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y

# ESB 時は dongle 側がキーマップを評価するため、keymap で使う
# runtime 系を mona2_r と揃える。
# コンボ/エンコーダは sekigon の dynamic-* (stock combo listener /
# dynamic_sensor_binding_lookup のフック経由で正しい順序になる)。
CONFIG_ZMK_DYNAMIC_SETTINGS=y
CONFIG_ZMK_DYNAMIC_COMBO=y
CONFIG_ZMK_DYNAMIC_COMBO_MAX_SLOTS=8
CONFIG_ZMK_DYNAMIC_ENCODER_RUNTIME=y
CONFIG_SETTINGS_NVS=y
# &rmacro / input-processor はイベント順序に依存しないため cormoran 系のまま。
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256

# dongle 側 runtime 系を Studio から参照/編集できるようにする
# (ESB 中は dongle 側が keymap を評価するため、編集対象も dongle 側になる)
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# 大きめの RPC payload (runtime macro の large-value 書き込み等) と
# runtime-input-processor の ListInputProcessors 通知 (low-priority work queue 上で
# protobuf エンコードするため既定 768B では MPU stack guard fault を起こす) に合わせる
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
