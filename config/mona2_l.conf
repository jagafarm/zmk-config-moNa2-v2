#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=7
CONFIG_EC11_THREAD_STACK_SIZE=2048

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Kscan Diagnostics ----------------
# 周辺側 (左手) でもキー統計を収集し、中央側 (右手) 経由で DYA Studio に返す。
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は左右で同じ値にする必要がある。
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

#Watchdog -------------------------
# 周辺側 (左手) も自分自身のインシデントを記録する。
# 中央側から中継して DYA Studio の「安定性」タブで
# "Peripheral" を選ぶと参照できる。
CONFIG_ZMK_WATCHDOG=y

#nemu-link -------------------------
# 独自 2.4GHz (ESB) と BLE を実行時切替する構成。
# BOOT_ESB: 起動時から 2.4GHz モード。ドングル不在時は
# chord (最左列の 2 キー同時長押し) か &nl_mode で BLE へ切替。
CONFIG_ZMK_NEMU_LINK=y
CONFIG_ZMK_NEMU_LINK_MODE_SWITCH=y
CONFIG_ZMK_NEMU_LINK_MODE_CHORD=y
CONFIG_ZMK_NEMU_LINK_BOOT_ESB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
# 左手は split peripheral のため ZMK_NEMU_LINK_STUDIO_ENDPOINT は Kconfig 依存上
# 有効化できない (by design)。Studio 同期は BLE central の右手 (mona2_r) が担当する。
